packages:
  - "apps/*"
  - "packages/*"
  - "docs/wiki"

# pnpm 10+ 기본 정책: postinstall 스크립트를 자동 실행하지 않음.
# 네이티브 바이너리가 필요한 패키지는 명시적으로 허용.
# - workerd: Cloudflare Workers 로컬 런타임 (wrangler dev 필수)
# - esbuild: Vite/Rollup 번들러 (클라이언트 빌드 필수)
# - @swc/core: Vite 플러그인 빠른 트랜스파일
# - sharp: Astro/wiki 이미지 최적화
# - @sentry/cli, protobufjs, core-js-pure: 특정 의존성 postinstall
onlyBuiltDependencies:
  - "@sentry/cli"
  - "@swc/core"
  - core-js-pure
  - esbuild
  - protobufjs
  - sharp
  - workerd
