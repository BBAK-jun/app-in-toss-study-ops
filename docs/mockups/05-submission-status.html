<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyOps Bot — 제출 현황</title>
<link rel="stylesheet" href="tds.css">
</head>
<body>
<div class="device">
  <div class="status-bar">
    <span>9:41</span>
    <span class="right">
      <span class="bars"><span></span><span></span><span></span><span></span></span>
      <span style="font-size:13px;font-weight:600;">5G</span>
      <span class="battery"><span></span></span>
    </span>
  </div>

  <div class="nav">
    <button class="nav-left" aria-label="뒤로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <div class="nav-title">15회차 제출 현황</div>
    <button class="nav-right">
      <span style="font-size:14px;color:var(--tds-fg-secondary);">공유</span>
    </button>
  </div>

  <div class="screen">
    <!-- Hero 카드: 대형 % + 진행바 + 제출/미제출 카운트 + 긴급도 -->
    <div class="progress-card" style="background:linear-gradient(135deg, var(--tds-blue-tint), var(--tds-surface-alt)); padding:24px 20px;">
      <div style="font-size:14px;color:var(--tds-fg-secondary);margin-bottom:8px;">15회차 · React Navigation</div>
      <div style="display:flex;align-items:baseline;gap:2px;margin-bottom:12px;">
        <span style="font-size:52px;font-weight:800;color:#dc2626;line-height:1;">75</span>
        <span style="font-size:24px;font-weight:700;color:#dc2626;">%</span>
      </div>
      <div class="progress-bar" style="height:10px;border-radius:5px;margin-bottom:10px;"><div class="fill" style="width:75%;background:#f59e0b;border-radius:5px;"></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:14px;">
        <span style="font-weight:600;color:var(--tds-fg-primary);">9/12명 제출 · 3명 미제출</span>
        <span style="color:var(--tds-warn);font-weight:600;">2일 이내</span>
      </div>
    </div>

    <!-- 제출자 섹션 -->
    <div class="section" style="margin-top:24px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div class="list-header" style="color:var(--tds-success);">제출자 (9)</div>
        <button style="font-size:13px;color:var(--tds-blue);font-weight:600;">제출 등록</button>
      </div>

      <div class="list-row padding-s">
        <div class="lr-thumb" style="background:var(--tds-success-tint);color:var(--tds-success);width:36px;height:36px;font-size:13px;">HK</div>
        <div class="lr-content">
          <div class="lr-title" style="font-size:16px;">최하경 · @hong</div>
          <div class="lr-subtitle"><span style="color:var(--tds-blue);">PR 링크</span> · 2일 전</div>
        </div>
      </div>

      <div class="list-row padding-s">
        <div class="lr-thumb" style="background:var(--tds-success-tint);color:var(--tds-success);width:36px;height:36px;font-size:13px;">DS</div>
        <div class="lr-content">
          <div class="lr-title" style="font-size:16px;">정다솜 · @dasom</div>
          <div class="lr-subtitle"><span style="color:var(--tds-blue);">블로그 링크</span> · 3일 전</div>
        </div>
      </div>

      <div class="list-row padding-s">
        <div class="lr-thumb" style="background:var(--tds-success-tint);color:var(--tds-success);width:36px;height:36px;font-size:13px;">YR</div>
        <div class="lr-content">
          <div class="lr-title" style="font-size:16px;">한예린 · @yerin</div>
          <div class="lr-subtitle"><span style="color:var(--tds-blue);">PR 링크</span> · 3일 전</div>
        </div>
      </div>

      <div class="list-row padding-s">
        <div class="lr-thumb" style="background:var(--tds-success-tint);color:var(--tds-success);width:36px;height:36px;font-size:13px;">+6</div>
        <div class="lr-content">
          <div class="lr-title" style="font-size:14px;color:var(--tds-fg-secondary);">외 6명 제출 완료</div>
        </div>
        <div class="lr-right"><span class="chev">›</span></div>
      </div>
    </div>

    <!-- 미제출자 섹션 (시각적 강조) -->
    <div class="section" style="margin-top:20px;background:#fef2f2;border-radius:12px;padding:4px 0;">
      <div class="list-header" style="color:#dc2626;padding:8px 16px 4px;">미제출자 (3)</div>

      <div class="list-row padding-s">
        <div class="lr-thumb" style="background:#fee2e2;color:#dc2626;width:36px;height:36px;font-size:13px;">JY</div>
        <div class="lr-content">
          <div class="lr-title" style="font-size:16px;">김지연 · @jyi</div>
          <div class="lr-subtitle">마감 2일 전</div>
        </div>
      </div>

      <div class="list-row padding-s">
        <div class="lr-thumb" style="background:#fee2e2;color:#dc2626;width:36px;height:36px;font-size:13px;">SM</div>
        <div class="lr-content">
          <div class="lr-title" style="font-size:16px;">박성민 · @park</div>
          <div class="lr-subtitle">마감 2일 전</div>
        </div>
      </div>

      <div class="list-row padding-s">
        <div class="lr-thumb" style="background:#fee2e2;color:#dc2626;width:36px;height:36px;font-size:13px;">JH</div>
        <div class="lr-content">
          <div class="lr-title" style="font-size:16px;">이정훈 · @lee</div>
          <div class="lr-subtitle">마감 2일 전 · 연속 2회 미제출</div>
        </div>
      </div>
    </div>
  </div>

  <!-- BottomCTA: 미제출자 리마인드 -->
  <div class="bottom-cta">
    <button class="btn primary">미제출자 3명에게 리마인드 보내기</button>
  </div>
</div>
</body>
</html>
