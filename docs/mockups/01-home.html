<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyOps Bot — 스터디 목록</title>
<link rel="stylesheet" href="tds.css">
</head>
<body>
<div class="device">
  <!-- Status Bar -->
  <div class="status-bar">
    <span>9:41</span>
    <span class="right">
      <span class="bars"><span></span><span></span><span></span><span></span></span>
      <span style="font-size:13px;font-weight:600;">5G</span>
      <span class="battery"><span></span></span>
    </span>
  </div>

  <!-- Navigation (필수) -->
  <div class="nav">
    <div class="nav-title">StudyOps</div>
    <div class="nav-right">
      <button aria-label="알림" style="padding:6px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Screen body -->
  <div class="screen">
    <!-- HeroCard: 미제출자 집계 + 리마인드 CTA -->
    <div class="progress-card" style="background:linear-gradient(135deg, var(--tds-blue-tint), var(--tds-surface-alt)); padding:24px 20px;">
      <div style="font-size:15px;font-weight:600;color:var(--tds-fg-secondary);margin-bottom:4px;">리마인드가 필요해요</div>
      <div style="display:flex;align-items:baseline;gap:4px;margin-bottom:8px;">
        <span style="font-size:42px;font-weight:800;color:var(--tds-blue);line-height:1;">7</span>
        <span style="font-size:16px;color:var(--tds-fg-secondary);">명</span>
      </div>
      <div style="font-size:13px;color:var(--tds-fg-secondary);margin-bottom:16px;">3개 스터디에서 미제출</div>
      <button class="btn primary" style="width:100%;">리마인드 보내기</button>
    </div>

    <!-- 스터디 목록 -->
    <div class="section" style="margin-top:24px;">
      <div class="list-header">내 스터디</div>

      <!-- 알고리즘 스터디: 미제출 있음, 60% -->
      <div class="list-row">
        <div class="lr-content">
          <div class="lr-title">알고리즘 스터디</div>
          <div class="lr-subtitle">2명 미제출 · 3회차 · 2일 이내</div>
        </div>
        <div class="lr-right">
          <span style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:28px;border-radius:8px;font-size:13px;font-weight:700;background:#fee2e2;color:#dc2626;">60%</span>
          <span class="chev">›</span>
        </div>
      </div>

      <!-- CS 면접 스터디: 전원 제출, 100% -->
      <div class="list-row">
        <div class="lr-content">
          <div class="lr-title">CS 면접 스터디</div>
          <div class="lr-subtitle">전원 제출 · 2회차 · 2일 이내</div>
        </div>
        <div class="lr-right">
          <span style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:28px;border-radius:8px;font-size:13px;font-weight:700;background:#dcfce7;color:#16a34a;">100%</span>
          <span class="chev">›</span>
        </div>
      </div>

      <!-- 글쓰기 모임: 미제출 있음, 40% -->
      <div class="list-row">
        <div class="lr-content">
          <div class="lr-title">글쓰기 모임</div>
          <div class="lr-subtitle">3명 미제출 · 5회차 · 오늘 마감</div>
        </div>
        <div class="lr-right">
          <span style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:28px;border-radius:8px;font-size:13px;font-weight:700;background:#fee2e2;color:#dc2626;">40%</span>
          <span class="chev">›</span>
        </div>
      </div>
    </div>

    <!-- 스터디 만들기 -->
    <div class="section" style="margin-top:20px;">
      <div class="list-row">
        <div class="lr-thumb" style="background:var(--tds-blue-tint);color:var(--tds-blue);">+</div>
        <div class="lr-content">
          <div class="lr-title">스터디 만들기</div>
        </div>
        <div class="lr-right"><span class="chev">›</span></div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
