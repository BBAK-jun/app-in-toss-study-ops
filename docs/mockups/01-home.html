<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyOps Bot — 스터디 목록</title>
<link rel="stylesheet" href="tds.css">
</head>
<body>
<div class="device">
  <!-- Status Bar -->
  <div class="status-bar">
    <span>9:41</span>
    <span class="right">
      <span class="bars"><span></span><span></span><span></span><span></span></span>
      <span style="font-size:13px;font-weight:600;">5G</span>
      <span class="battery"><span></span></span>
    </span>
  </div>

  <!-- Navigation (필수) -->
  <div class="nav">
    <div class="nav-title">StudyOps</div>
    <div class="nav-right">
      <button aria-label="알림" style="padding:6px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Screen body -->
  <div class="screen">
    <!-- Top -->
    <div class="top">
      <h1 class="top-title">내 스터디</h1>
      <div class="top-subtitle">운영 중인 스터디 3개</div>
    </div>

    <!-- 이번 주 제출 현황 요약 카드 -->
    <div class="progress-card">
      <div class="pc-label">이번 주 제출률</div>
      <div class="pc-rate">68<span class="denom">%</span></div>
      <div class="progress-bar"><div class="fill" style="width:68%"></div></div>
      <div style="font-size:13px;color:var(--tds-blue);margin-top:8px;">미제출자 7명에게 리마인드를 보낼 수 있어요</div>
    </div>

    <!-- 스터디 목록 -->
    <div class="section" style="margin-top:20px;">
      <div class="list-header">진행 중</div>

      <div class="list-row">
        <div class="lr-thumb">RN</div>
        <div class="lr-content">
          <div class="lr-title">리액트 네이티브 스터디</div>
          <div class="lr-subtitle">15회차 · 12명 참여</div>
        </div>
        <div class="lr-right">
          <span class="badge warn">3명 미제출</span>
          <span class="chev">›</span>
        </div>
      </div>

      <div class="list-row">
        <div class="lr-thumb" style="background:var(--tds-success-tint);color:var(--tds-success);">알</div>
        <div class="lr-content">
          <div class="lr-title">알고리즘 스터디</div>
          <div class="lr-subtitle">8회차 · 8명 참여</div>
        </div>
        <div class="lr-right">
          <span class="badge success">전원 제출</span>
          <span class="chev">›</span>
        </div>
      </div>

      <div class="list-row">
        <div class="lr-thumb" style="background:var(--tds-warn-tint);color:var(--tds-warn);">글</div>
        <div class="lr-content">
          <div class="lr-title">글쓰기 모임</div>
          <div class="lr-subtitle">5회차 · 6명 참여</div>
        </div>
        <div class="lr-right">
          <span class="badge danger">마감 임박</span>
          <span class="chev">›</span>
        </div>
      </div>
    </div>

    <!-- 빠른 실행 -->
    <div class="section">
      <div class="list-header">빠른 실행</div>
      <div class="list-row">
        <div class="lr-thumb" style="background:var(--tds-blue-tint);color:var(--tds-blue);">+</div>
        <div class="lr-content">
          <div class="lr-title">새 스터디 만들기</div>
          <div class="lr-subtitle">제출 운영을 시작해요</div>
        </div>
        <div class="lr-right"><span class="chev">›</span></div>
      </div>
      <div class="list-row">
        <div class="lr-thumb" style="background:var(--tds-surface-alt);color:var(--tds-fg-secondary);">🔔</div>
        <div class="lr-content">
          <div class="lr-title">오늘 보낼 리마인드</div>
          <div class="lr-subtitle">3개 스터디 · 7명</div>
        </div>
        <div class="lr-right"><span class="chev">›</span></div>
      </div>
    </div>
  </div>

  <!-- 플로팅 탭바 (TDS 가이드: 2~5개 탭, 플로팅 형태) -->
  <div class="tab-bar">
    <button class="tab active">스터디</button>
    <button class="tab">리마인드</button>
    <button class="tab">설정</button>
  </div>
</div>
</body>
</html>
