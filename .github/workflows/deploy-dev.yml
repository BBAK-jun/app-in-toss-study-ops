# deploy-dev.yml — main push 시 dev 환경 자동 배포
# 서버(Worker) + 클라이언트(머지한담) 동시 배포
#
# 필수 GitHub Secrets:
#   CLOUDFLARE_API_TOKEN   — Workers Edit 권한
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare 계정 ID
#   AIT_DEV_API_KEY        — 앱인토스 dev 프로파일 API 키
name: Deploy Dev

on:
  push:
    branches: [main]

# 동시 배포 방지 — 같은 브랜치면 이전 실행 취소
concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  # CI 게이트 — Turbo가 typecheck + build를 캐싱과 함께 실행
  verify:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo typecheck build
        env:
          # Remote Cache — secrets 미등록 시 자동으로 로컬 캐시만 사용.
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      - id: check
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  deploy-server:
    name: Deploy Server (Worker dev)
    needs: verify
    if: needs.verify.outputs.passed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo build가 shared → server 순서로 자동 처리
      - run: pnpm turbo build --filter=studyops-server...
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      - name: Deploy Worker (dev)
        working-directory: apps/server
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-client:
    name: Deploy Client (머지한담)
    needs: verify
    if: needs.verify.outputs.passed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # shared 빌드만 client 의존성에 필요
      - run: pnpm turbo build --filter=@studyops/shared
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      - name: Write ait credentials
        run: |
          mkdir -p ~/.ait
          cat > ~/.ait/credentials <<EOF
          {
            "dev": "${{ secrets.AIT_DEV_API_KEY }}"
          }
          EOF
          chmod 600 ~/.ait/credentials

      - name: Build & Deploy client (dev)
        working-directory: apps/client
        run: pnpm deploy:dev
        env:
          VITE_APP_ENV: development
          VITE_API_BASE_URL: https://studyops-server.mountain-race.workers.dev
