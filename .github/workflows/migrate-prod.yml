# migrate-prod.yml — 프로덕션 D1 마이그레이션 전용 (workflow_dispatch)
# CI에서 자동 실행되지 않음 — 사용자가 Actions 탭에서 의도적으로 실행.
# "confirm" 입력에 "yes"를 입력해야만 진행.
#
# 필요 권한: CLOUDFLARE_API_TOKEN (D1 Edit)
name: Migrate Production D1

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm: apply pending migrations to studyops-db-prod (IRREVERSIBLE)'
        required: true
        default: ''
      dry_run:
        description: 'Dry run — list pending migrations without applying'
        required: false
        default: true
        type: boolean

concurrency:
  group: migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply D1 Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: List pending migrations
        working-directory: apps/server
        run: pnpm exec wrangler d1 migrations list studyops-db-prod --remote --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Abort if not confirmed
        if: ${{ github.event.inputs.confirm != 'yes' }}
        run: |
          echo "❌ confirm input is not 'yes' — aborting. Set confirm=yes in workflow_dispatch to proceed."
          exit 1

      # dry_run=true 면 위 'List pending migrations' 단계만 실행(=dry-run)하고 종료.
      # (wrangler 4.114 의 `d1 migrations apply` 는 --dry-run 플래그를 지원하지 않으므로
      #  별도 dry-run apply 단계 대신 list 단계로 대체.)
      - name: Apply migrations
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.confirm == 'yes' }}
        working-directory: apps/server
        run: |
          echo "🚀 Applying migrations to studyops-db-prod..."
          pnpm exec wrangler d1 migrations apply studyops-db-prod --remote --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
