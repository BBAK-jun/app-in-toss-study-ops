# migrate-prod.yml — 프로덕션 D1 마이그레이션 전용 (workflow_dispatch)
# CI에서 자동 실행되지 않음 — 사용자가 Actions 탭에서 의도적으로 실행.
# "confirm" 입력에 "yes"를 입력해야만 진행.
#
# 필요 권한: CLOUDFLARE_API_TOKEN (D1 Edit)
name: Migrate Production D1

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm: apply pending migrations to studyops-db-prod (IRREVERSIBLE)'
        required: true
        default: ''
      dry_run:
        description: 'Dry run — list pending migrations without applying'
        required: false
        default: true
        type: boolean

concurrency:
  group: migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply D1 Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: List pending migrations
        working-directory: apps/server
        run: npx wrangler d1 migrations list studyops-db-prod --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Abort if not confirmed
        if: ${{ github.event.inputs.confirm != 'yes' }}
        run: |
          echo "❌ confirm input is not 'yes' — aborting. Set confirm=yes in workflow_dispatch to proceed."
          exit 1

      - name: Apply migrations (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        working-directory: apps/server
        run: |
          echo "⚠️  Dry run mode — checking what would be applied. Re-run with dry_run=false to apply."
          echo "Use 'npm run db:apply:prod' locally to apply."
          npx wrangler d1 migrations apply studyops-db-prod --remote --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply migrations
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.confirm == 'yes' }}
        working-directory: apps/server
        run: |
          echo "🚀 Applying migrations to studyops-db-prod..."
          npx wrangler d1 migrations apply studyops-db-prod --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
