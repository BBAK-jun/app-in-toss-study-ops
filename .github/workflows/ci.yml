# ci.yml — PR/push 시 타입체크 + 빌드
# 트리거: main 브랜치 PR, main push
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo가 의존성 그래프에 따라 shared → server/client 순서로 자동 빌드.
      # 캐시 적중 시 건너뛰며, --filter=^... 옵션 불필요.
      - name: Turbo typecheck + build + test (cached)
        run: pnpm turbo typecheck build test
        env:
          # Remote Cache (Vercel) — secrets 미등록 시 자동으로 로컬 캐시만 사용.
          # 설정 방법은 README "Remote Cache 설정" 섹션 참조.
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      - name: Wrangler types check
        run: pnpm types:server
