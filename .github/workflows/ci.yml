# ci.yml — PR/push 시 타입체크 + 빌드
# 트리거: main 브랜치 PR, main push
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared + client-sdk packages
        run: pnpm build:shared && pnpm build:client-sdk

      - name: Build client-sdk package
        run: pnpm build:client-sdk

      - name: Typecheck all workspaces
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build all workspaces
        run: pnpm build

      - name: Wrangler types check
        run: pnpm types:server
